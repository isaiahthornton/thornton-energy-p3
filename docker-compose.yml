services:
  # ---------- SQL Server ----------
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"                      # required by Microsoft's image
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?Set SQL_PASSWORD in your .env file}    # from .env
    ports:
      - "${DB_PORT:-14330}:1433"                        # optional: lets SSMS on your PC connect to localhost,14330
    volumes:
      - sqldata:/var/opt/mssql              # keep the data when the container is removed
    healthcheck:                            # "healthy" once SQL Server answers a query
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------- .NET API ----------
  api:
    build: ./server/ThorntonEnergy.Api      # builds from server/ThorntonEnergy.Api/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=ThorntonEnergy;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in your .env file}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
    depends_on:
      db:
        condition: service_healthy          # wait for SQL Server to be ready before starting
    ports:
      - "${API_PORT:-8080}:8080"                         # optional: call the API directly at localhost:8080

  # ---------- Angular + nginx ----------
  web:
    build: ./client
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-4200}:80"                           # open http://localhost:4200 (change with WEB_PORT)

volumes:
  sqldata:
