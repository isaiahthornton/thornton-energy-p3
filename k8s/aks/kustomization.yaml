# Azure Kubernetes Service: pull the versioned images from the three Docker Hub accounts.
# Replace the three account names once each owner has pushed their images (public repos).
resources:
  - ../base
images:
  - { name: thornton-db,        newName: michaelgeo29/thornton-db,        newTag: "1.0" }
  - { name: thornton-api,       newName: michaelgeo29/thornton-api,       newTag: "1.0" }
  - { name: thornton-customers, newName: michaelgeo29/thornton-customers, newTag: "1.0" }
  - { name: thornton-billing,   newName: michaelgeo29/thornton-billing,   newTag: "1.0" }
  - { name: thornton-outages,   newName: michaelgeo29/thornton-outages,   newTag: "1.0" }
  - { name: thornton-metering,  newName: michaelgeo29/thornton-metering,  newTag: "1.0" }
  - { name: thornton-messages,  newName: michaelgeo29/thornton-messages,  newTag: "1.0" }
  - { name: thornton-web,       newName: michaelgeo29/thornton-web,       newTag: "1.0" }
