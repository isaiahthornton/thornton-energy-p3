server {
    listen 80;                       # nginx listens on port 80 inside the container
    root /usr/share/nginx/html;      # where the built Angular files are
    index index.html;

    # Service-to-service endpoints (login/register checks) are never reachable from a browser.
    # "^~" means: if this prefix matches, stop here and skip the regex rules below.
    location ^~ /api/internal/ {
        return 404;
    }

    # /api/customers and /api/ratePlans go to the Customers service (case-insensitive, like ASP.NET routes)
    location ~* ^/api/(customers|rateplans)(/|$) {
        proxy_pass http://customers:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Strangler pattern: /api/messages now goes to the Messages service.
    # nginx picks the longest matching prefix, so this wins over /api/ below.
    # (Stands in for the AKS ingress rule locally.)
    location /api/messages {
        proxy_pass http://messages:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api/meters and /api/meterReadings go to the Metering service.
    # A regex ("~*" = case-insensitive), because ASP.NET routes ignore case but nginx prefixes don't.
    # "(/|$)" means the name must end there, so e.g. /api/metersXYZ would not match.
    location ~* ^/api/(meters|meterreadings)(/|$) {
        proxy_pass http://metering:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api/bills (including /api/bills/summary, /usage-trend and /activity) goes to the Billing service
    location /api/bills {
        proxy_pass http://billing:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api/outages (including /api/outages/map, /summary and /activity) goes to the Outages service
    location /api/outages {
        proxy_pass http://outages:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else under /api: pass it to the "api" container (the monolith). The /api prefix is kept,
    # which matches your controllers' [Route("api/...")].
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is the Angular app. If the file doesn't exist (e.g. /account/bills),
    # send index.html and let the Angular router handle the URL.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
