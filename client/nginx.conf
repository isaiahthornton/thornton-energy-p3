server {
    listen 80;                       # nginx listens on port 80 inside the container
    root /usr/share/nginx/html;      # where the built Angular files are
    index index.html;

    # Strangler pattern: /api/messages now goes to the Messages service.
    # nginx picks the longest matching prefix, so this wins over /api/ below.
    # (Stands in for the AKS ingress rule locally.)
    location /api/messages {
        proxy_pass http://messages:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else under /api: pass it to the "api" container (the monolith). The /api prefix is kept,
    # which matches your controllers' [Route("api/...")].
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is the Angular app. If the file doesn't exist (e.g. /account/bills),
    # send index.html and let the Angular router handle the URL.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
